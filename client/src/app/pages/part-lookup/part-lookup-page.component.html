<div class="page">
  <!-- Pixel-block wordmark header (shared with the Vehicle Summary page). -->
  <div class="page-head">
    <app-pixel-title
      text="Parts"
      tagline="Part lookup"
      sub="Search live listings by part name and scope them to your vehicle, or arrive here from a code lookup."
    />
  </div>

  <!-- Console toolbar: part search (left) + vehicle scope (right). -->
  <div class="parts-toolbar">
    <form class="toolbar-search" (ngSubmit)="submitSearch()">
      <span class="ts-prompt">parts<span class="ts-caret">$</span></span>
      <input
        class="toolbar-search-input"
        [ngModel]="query()"
        (ngModelChange)="onQueryInput($event)"
        name="partQuery"
        placeholder="oxygen sensor, brake pads…"
        autocomplete="off"
        spellcheck="false"
      />
      @if (query()) {
        <button type="button" class="btn toolbar-search-clear" (click)="clearSearch()" aria-label="Clear search">
          <mat-icon>close</mat-icon>
        </button>
      }
      <button type="submit" class="btn toolbar-search-go" aria-label="Search parts">
        <kbd class="ts-kbd">↵</kbd>
      </button>
    </form>

    <!-- Vehicle scope: saved-vehicle chips + a manual entry toggle. -->
    <div class="vehicle-scope" role="group" aria-label="Scope search to a vehicle">
      <span class="scope-label">Vehicle</span>

      @for (v of savedVehicles(); track v.id) {
        <button
          type="button"
          class="btn scope-chip"
          [class.active]="selectedVehicleId() === v.id"
          (click)="selectVehicle(v.id)"
        >{{ vehicleName(v) }}</button>
      }

      <button
        type="button"
        class="btn scope-chip scope-chip--manual"
        [class.active]="manualMode()"
        (click)="enterManual()"
      >
        <mat-icon>edit</mat-icon> Manual
      </button>

      @if (selectedVehicleId() || manualMode()) {
        <button type="button" class="btn scope-clear" (click)="clearVehicle()" aria-label="Clear vehicle scope">
          <mat-icon>close</mat-icon>
        </button>
      }
    </div>
  </div>

  <!-- Manual year/make/model row (only when "Manual" is active). -->
  @if (manualMode()) {
    <div class="manual-vehicle-bar">
      <input
        class="manual-input manual-year"
        type="text"
        inputmode="numeric"
        placeholder="Year"
        [ngModel]="manualYear()"
        (ngModelChange)="manualYear.set($event)"
        (blur)="applyManual()"
        name="manualYear"
      />
      <input
        class="manual-input"
        type="text"
        placeholder="Make"
        [ngModel]="manualMake()"
        (ngModelChange)="manualMake.set($event)"
        (blur)="applyManual()"
        name="manualMake"
      />
      <input
        class="manual-input"
        type="text"
        placeholder="Model"
        [ngModel]="manualModel()"
        (ngModelChange)="manualModel.set($event)"
        (blur)="applyManual()"
        name="manualModel"
      />
      <button type="button" class="btn manual-apply" (click)="applyManual()">Apply</button>
    </div>
  }

  <!-- Results: the shared live-parts locator (eBay search + filters + carousel +
       send-list). Given a part name + vehicle, it runs the search itself. -->
  <div class="parts-body">
    @if (hasSearch()) {
      <app-parts-locator
        [partNames]="partNames()"
        [vehicle]="vehicle()"
      />
    } @else {
      <div class="empty-overlay">
        <mat-icon>search</mat-icon>
        <p>Search for a part above, or select parts from a code lookup to find live listings.</p>
      </div>
    }
  </div>
</div>
