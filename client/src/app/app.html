<div class="app-shell">

  <!-- ── Top bar ──────────────────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="header-left" [class.sidebar-collapsed]="sidebarCollapsed()">
      <!-- Sidebar (and thus its toggle) is a signed-in-only feature. -->
      @if (auth.isSignedIn()) {
        <button type="button" class="btn hamburger" (click)="toggleSidebar()" aria-label="Toggle menu">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <a class="logo" routerLink="/home">
        <mat-icon class="logo-icon">bluetooth_drive</mat-icon>
        <span class="logo-text">Aura<span class="logo-text-accent">Link.vin</span></span>
      </a>
    </div>

    <div class="header-right">
      @if (showAiSearch()) {
        <app-ai-search class="header-ai-search" />
      }
      <button type="button" class="btn header-link theme-toggle" (click)="theme.toggle()"
              [matTooltip]="theme.isLight() ? 'Switch to dark' : 'Switch to light'"
              [attr.aria-label]="theme.isLight() ? 'Switch to dark theme' : 'Switch to light theme'">
        <mat-icon>{{ theme.isLight() ? 'dark_mode' : 'light_mode' }}</mat-icon>
      </button>
      <a class="header-link" routerLink="/faq" matTooltip="Help & FAQ" aria-label="Help & FAQ">
        <mat-icon>help_outline</mat-icon>
      </a>

      <app-account-menu />
    </div>
  </header>

  <!-- ── Body: sidebar + routed page ─────────────────────────────────────── -->
  <div class="app-body">
    <!-- Sidebar is signed-in only; guests get just the routed /home page. -->
    @if (auth.isSignedIn()) {
      <!-- Scrim behind the mobile drawer; tap to dismiss. -->
      @if (mobileDrawerOpen()) {
        <div class="drawer-scrim" (click)="closeMobileDrawer()"></div>
      }

      <aside
        class="app-sidebar"
        [class.collapsed]="sidebarCollapsed()"
        [class.drawer-open]="mobileDrawerOpen()"
      >
        <!-- On the mobile drawer the sidebar is always expanded (icons + labels);
             tapping a nav item closes the drawer. -->
        <app-sidebar
          [collapsed]="sidebarCollapsed() && !mobileDrawerOpen()"
          (navigate)="closeMobileDrawer()"
        />
      </aside>
    }

    <main class="app-main">
      <router-outlet />

      <!-- Global footer: legal + help links reachable from every page. -->
      <footer class="app-footer">
        <span class="app-footer-brand">© {{ currentYear }} AuraLink</span>
        <nav class="app-footer-links" aria-label="Footer">
          <a routerLink="/terms">Terms</a>
          <a routerLink="/privacy">Privacy</a>
          <a routerLink="/faq">Help &amp; FAQ</a>
        </nav>
      </footer>
    </main>
  </div>

  <!-- TEMPORARY floating tier switcher — for testing tier-gated features before
       real billing exists. Signed-in only. Remove once subscriptions are wired. -->
  @if (auth.isSignedIn()) {
    <div class="tier-switch" role="group" aria-label="Switch plan (testing)">
      <span class="tier-switch-tag">Test tier</span>
      @for (t of tiers; track t) {
        <button type="button" class="tier-switch-btn"
                [class.active]="tierService.tier() === t"
                (click)="tierService.set(t)">
          {{ t }}
        </button>
      }
      <a class="tier-switch-plans" routerLink="/plan" matTooltip="Plans & pricing" aria-label="Plans">
        <mat-icon>workspace_premium</mat-icon>
      </a>
    </div>
  }

  <!-- App-wide toasts + offline banner (fixed-position, renders above content). -->
  <app-toast-host />

</div>
