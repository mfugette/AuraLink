<!-- Compact top-bar trigger — styled as a shell prompt to echo the Aura terminal. -->
<button type="button" class="ai-trigger" (click)="activate()" aria-label="Ask Aura">
  <span class="ai-trigger-prompt">aura<span class="ai-trigger-caret">$</span></span>
  <span class="ai-trigger-text">chat with aura…</span>
  <kbd class="ai-trigger-kbd">↵</kbd>
</button>

<!-- Activated overlay — a compact terminal window echoing the /assistant page.
     Submitting hands off to the /assistant page. -->
@if (active()) {
  <div class="ai-overlay" (click)="close()">
    <div class="ai-panel" (click)="$event.stopPropagation()">
      <!-- Window chrome (matches the Aura terminal's title bar) -->
      <div class="ai-bar">
        <span class="ai-dots"><i></i><i></i><i></i></span>
        <span class="ai-bar-title">aura — quick chat</span>
        <button type="button" class="btn ai-close" (click)="close()" aria-label="Close Aura">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <!-- Console body: boot banner + suggestions, printed like shell output -->
      <div class="ai-body">
        <div class="ai-boot">
          <span class="ai-mark">▸</span> aura diagnostic shell — how can i help?<br />
          <span class="ai-mark">▸</span> describe a symptom, ask about a code, or run a suggestion below.
        </div>

        <!-- Suggestion chips (runnable commands) -->
        <div class="ai-chips">
          @for (s of suggestions; track s) {
            <button type="button" class="btn ai-chip" (click)="useSuggestion(s)">{{ s }}</button>
          }
        </div>

        <!-- Live prompt line -->
        <div class="ai-input-row">
          <span class="ai-prompt">aura<span class="ai-caret">$</span></span>
          <input
            #overlayInput
            class="ai-input"
            [(ngModel)]="input"
            (keydown.enter)="send()"
            spellcheck="false"
            autocomplete="off"
            placeholder="type a command…"
          />
          <button type="button" class="btn ai-send" [disabled]="!input.trim()" (click)="send()" aria-label="Send">
            <kbd class="ai-trigger-kbd">↵</kbd>
          </button>
        </div>
      </div>

      <!-- Status footer -->
      <p class="ai-disclaimer">
        demo preview — aura isn’t connected yet. responses are placeholders.
      </p>
    </div>
  </div>
}
