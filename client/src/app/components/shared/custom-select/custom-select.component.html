<div #host class="custom-select" [class.disabled]="disabled">
  <button
    type="button"
    class="select-trigger"
    [class.open]="open()"
    [disabled]="disabled"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
    role="combobox"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
  >
    @if (icon) {
      <mat-icon>{{ icon }}</mat-icon>
    }
    <span class="select-value" [class.placeholder]="!selectedLabel()">
      {{ selectedLabel() ?? placeholder }}
    </span>
    @if (loading) {
      <mat-icon class="spin">progress_activity</mat-icon>
    } @else {
      <mat-icon class="chevron">expand_more</mat-icon>
    }
  </button>

  @if (open()) {
    <div class="select-panel">
      @if (searchable) {
        <input
          #searchInput
          class="select-search"
          [ngModel]="searchText()"
          (ngModelChange)="onSearchInput($event)"
          (keydown)="handleListKeydown($event)"
          [placeholder]="searchPlaceholder"
          autocomplete="off"
        />
      }
      <ul class="select-list" role="listbox">
        @for (opt of filteredOptions(); track opt.value; let i = $index) {
          <li
            class="select-option"
            role="option"
            [class.active]="i === activeIndex()"
            [class.selected]="opt.value === value"
            [attr.aria-selected]="opt.value === value"
            (mousedown)="$event.preventDefault(); selectOption(opt)"
            (mouseenter)="activeIndex.set(i)"
          >
            {{ opt.label }}
          </li>
        } @empty {
          <li class="select-empty">No matches</li>
        }
      </ul>
    </div>
  }
</div>
