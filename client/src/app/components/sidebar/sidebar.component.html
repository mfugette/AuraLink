<nav class="sidebar" [class.collapsed]="collapsed" aria-label="Primary">
  <!-- Toggle section: a distinct top bar with a "NAVIGATION" header (expanded)
       and the collapse/expand toggle, separated from the nav list by a divider
       (matches the reference). Hidden on the mobile drawer (always expanded). -->
  <div class="sidebar-toggle-section">
    @if (!collapsed) {
      <span class="sidebar-nav-label">Navigation</span>
    }
    <button
      type="button"
      class="btn sidebar-toggle"
      (click)="toggle.emit()"
      [matTooltip]="collapsed ? 'Expand menu' : 'Collapse menu'"
      matTooltipPosition="right"
      [attr.aria-label]="collapsed ? 'Expand menu' : 'Collapse menu'"
    >
      <app-icon [name]="collapsed ? 'chevron_right' : 'chevron_left'" [size]="20" />
    </button>
  </div>

  <hr class="sidebar-divider" />

  @for (item of items; track item.route) {
    <a
      class="nav-item"
      [routerLink]="item.route"
      routerLinkActive="active"
      [matTooltip]="collapsed ? item.label : ''"
      matTooltipPosition="right"
      (click)="navigate.emit()"
    >
      <app-icon [name]="item.icon" [size]="18" />
      <span class="nav-label">{{ item.label }}</span>
      @if (locked(item)) {
        <app-icon class="nav-lock" name="lock" [size]="15" [matTooltip]="collapsed ? '' : 'Upgrade to unlock'" />
      }
    </a>
  }
</nav>
