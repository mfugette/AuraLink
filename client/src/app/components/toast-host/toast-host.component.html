<!-- Persistent offline banner (pinned top-center). -->
@if (toast.offline()) {
  <div class="offline-banner" role="status">
    <app-icon name="cloud_off" />
    You're offline — some features won't work until you reconnect.
  </div>
}

<!-- Transient toasts (stacked bottom-right). -->
<div class="toast-stack" aria-live="polite" aria-atomic="false">
  @for (t of toast.toasts(); track t.id) {
    <div class="toast toast--{{ t.kind }}" role="status">
      <app-icon class="toast-icon" [name]="iconFor(t.kind)" />
      <span class="toast-text">{{ t.text }}</span>
      <button type="button" class="toast-close" (click)="toast.dismiss(t.id)" aria-label="Dismiss">
        <app-icon name="close" />
      </button>
    </div>
  }
</div>
