<div class="panel-backdrop" (click)="close()">
  <div class="panel-modal" (click)="$event.stopPropagation()">
    <div class="panel-header">
      <h3 class="panel-title"><mat-icon>settings</mat-icon> Settings</h3>
      <button type="button" class="btn panel-close" (click)="close()" aria-label="Close">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="panel-body">
      @if (accountService.settings(); as settings) {
        <div class="settings-group">
          <h4 class="settings-group-title">Notifications</h4>

          <button type="button" class="btn setting-row" (click)="toggleNotifyEmail()">
            <div class="setting-row-text">
              <mat-icon>email</mat-icon>
              <span>Email me when a parts list is sent</span>
            </div>
            <span class="toggle" [class.on]="settings.notifyEmail"><span class="toggle-knob"></span></span>
          </button>

          <button type="button" class="btn setting-row" (click)="toggleNotifySms()">
            <div class="setting-row-text">
              <mat-icon>sms</mat-icon>
              <span>Text me when a parts list is sent</span>
            </div>
            <span class="toggle" [class.on]="settings.notifySms"><span class="toggle-knob"></span></span>
          </button>
        </div>

        <div class="settings-group">
          <h4 class="settings-group-title">Units</h4>
          <div class="unit-toggle">
            <button
              type="button"
              class="btn unit-option"
              [class.active]="settings.preferredUnits === 'imperial'"
              (click)="setUnits('imperial')"
            >
              Imperial (mi, °F)
            </button>
            <button
              type="button"
              class="btn unit-option"
              [class.active]="settings.preferredUnits === 'metric'"
              (click)="setUnits('metric')"
            >
              Metric (km, °C)
            </button>
          </div>
        </div>

        <div class="settings-group">
          <h4 class="settings-group-title">Appearance</h4>
          <div class="unit-toggle">
            <button
              type="button"
              class="btn unit-option"
              [class.active]="!theme.isLight()"
              (click)="setTheme('dark')"
            >
              <mat-icon>dark_mode</mat-icon> Dark
            </button>
            <button
              type="button"
              class="btn unit-option"
              [class.active]="theme.isLight()"
              (click)="setTheme('light')"
            >
              <mat-icon>light_mode</mat-icon> Light
            </button>
          </div>
        </div>
      } @else {
        <p class="settings-loading">Loading settings…</p>
      }
    </div>

    <div class="panel-footer">
      @if (saved()) {
        <span class="save-confirm"><mat-icon>check_circle</mat-icon> Saved</span>
      }
      <button type="button" class="btn panel-cancel-btn" (click)="close()">Close</button>
    </div>
  </div>
</div>
