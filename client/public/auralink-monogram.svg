<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 320 300" width="320" height="300">
  <title>AuraLink A+L monogram</title>
  <desc>An interlocked A and L forming the AuraLink monogram.</desc>
  <defs>
    <linearGradient id="al-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!--
    A single filled shape: the letter A on the left whose right leg drops down and
    turns right along the bottom to form the L's foot. The evenodd fill-rule
    carves out the A's triangular counter (the inner hole).
  -->
  <path fill="url(#al-grad)" fill-rule="evenodd" d="
    M 150 40
    L 224 40
    L 224 210
    L 300 210
    L 300 258
    L 150 258
    L 150 210
    L 110 210
    L 92 258
    L 30 258
    Z
    M 176 92
    L 176 162
    L 130 162
    Z
    M 176 92
    L 150 40
    L 176 92
    Z
  " />
</svg>
